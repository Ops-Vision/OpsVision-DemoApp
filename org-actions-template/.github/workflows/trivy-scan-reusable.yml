name: "Trivy scan (reusable)"

on:
  workflow_call:
    inputs:
      path:
        description: 'Path or image to scan'
        required: false
        type: string
        default: '.'
    secrets:
      GITHUB_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.12.0
        with:
          scan-type: fs
          path: ${{ inputs.path }}
          format: json
          output: trivy-report.json
          exit-code: '1'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
