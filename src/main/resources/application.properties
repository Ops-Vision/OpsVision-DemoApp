spring.application.name=demo-app

# Expose actuator endpoints needed by the OpsVision pipeline:
# - /actuator/prometheus -> scraped by Prometheus (job=opsvision-demo-app)
# - /actuator/health     -> used by backend/demo health checks
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.prometheus.enabled=true

# Publish http_server_requests_seconds_bucket histogram data so Prometheus
# can compute latency quantiles (p50/p95/p99) via histogram_quantile().
management.metrics.distribution.percentiles-histogram.http.server.requests=true
