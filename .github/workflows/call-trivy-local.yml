name: Trivy (org template caller)
on: [push, pull_request]

jobs:
  trivy:
    permissions:
      security-events: write
    # Replace <ORG> and <TEMPLATE_REPO> with your organization and template repo name
    # Example: uses: myorg/org-actions/.github/workflows/trivy-scan-reusable.yml@v1
    uses: Ops-Vision/OpsVision-Infrastructure/.github/workflows/trivy-scan-reusable.yml@main
    with:
      path: '.'
